name: build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
      fail-fast: false
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
    - uses: actions/checkout@v7

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.10.0"

    - name: Install Rust and configure cache
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt, clippy
        cache: true
        rustflags: ""

    # protoc is needed to build the tonic-based integration tests.
    - uses: taiki-e/install-action@protoc

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run cargo build
      run: cargo build --all-targets

    - name: Run rust unittests
      run: cargo test --all-targets

    - name: Run rust doctests
      run: cargo test --workspace --doc

    # `cargo package` requires every dependency version to exist on crates.io.
    # Restore the packaging check after h3-shim 0.5.1 is published.
